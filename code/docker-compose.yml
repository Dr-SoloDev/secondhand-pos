services:
  # ============================================================
  # MySQL Database
  # ============================================================
  db:
    image: mysql:8.0
    container_name: secondhand-pos-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: pos_system
      MYSQL_USER: posuser
      MYSQL_PASSWORD: pospass
      TZ: Asia/Bangkok
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./base-pos/database/pos_system.sql:/docker-entrypoint-initdb.d/01-base-schema.sql:ro
      - ./customizations/database/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./docker/mysql-init.sh:/docker-entrypoint-initdb.d/99-run-migrations.sh:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================
  # PHP + Apache (Web Server)
  # ============================================================
  web:
    build:
      context: ./docker
      dockerfile: Dockerfile.php
    container_name: secondhand-pos-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./base-pos:/var/www/html:rw
      - ./customizations:/var/www/customizations:rw
      - ./docker/apache-config.conf:/etc/apache2/sites-available/000-default.conf:ro
    environment:
      DB_HOST: db
      DB_NAME: pos_system
      DB_USER: posuser
      DB_PASS: pospass
      TZ: Asia/Bangkok
    depends_on:
      db:
        condition: service_healthy

  # ============================================================
  # phpMyAdmin (Database Management UI)
  # ============================================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: secondhand-pos-pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: rootpass
      UPLOAD_LIMIT: 64M
    depends_on:
      - db

volumes:
  db_data:
