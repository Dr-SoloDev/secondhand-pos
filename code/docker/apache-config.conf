<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Force UTF-8 for all text responses
    AddDefaultCharset UTF-8

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Index priority: index.html first (base-pos uses static HTML + AJAX)
    DirectoryIndex index.html index.php

    # JWT_SECRET is now passed via Docker Compose environment (from .env)

    Header always set ngrok-skip-browser-warning "true"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
