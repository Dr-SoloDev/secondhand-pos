<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Force UTF-8 for all text responses
    AddDefaultCharset UTF-8

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Index priority: index.html first (base-pos uses static HTML + AJAX)
    DirectoryIndex index.html index.php

    # JWT_SECRET is now passed via Docker Compose environment (from .env)

    # Custom error pages
    ErrorDocument 404 /admin/404.html
    ErrorDocument 500 /500.html

    # Return a real 404 for unknown frontend routes while leaving API/assets alone.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/api/
    RewriteCond %{REQUEST_URI} !^/assets/
    RewriteCond %{REQUEST_URI} !^/admin/404\.html$
    RewriteCond %{REQUEST_URI} !^/500\.html$
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ - [R=404,L]

    Header always set ngrok-skip-browser-warning "true"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
