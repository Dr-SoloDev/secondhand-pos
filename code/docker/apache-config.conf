<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Force UTF-8 for all text responses
    AddDefaultCharset UTF-8

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        # Return 404 for unknown frontend routes, but allow API/assets/existing files.
        RewriteEngine On
        RewriteCond %{REQUEST_URI} ^/api/ [OR]
        RewriteCond %{REQUEST_URI} ^/assets/ [OR]
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]
        RewriteRule ^ - [R=404,L]
    </Directory>

    # Index priority: index.html first (base-pos uses static HTML + AJAX)
    DirectoryIndex index.html index.php

    # JWT_SECRET is now passed via Docker Compose environment (from .env)

    # Custom error pages
    ErrorDocument 404 /admin/404.html
    ErrorDocument 500 /500.html

    Header always set ngrok-skip-browser-warning "true"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
