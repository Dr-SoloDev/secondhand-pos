# ============================================================
# UI Refresh Sandbox — instance แยกสำหรับทดสอบ UI
# (คัดลอกมาจาก docker-compose.yml หลัก, เปลี่ยนชื่อ/port/volume)
# วิธีรัน:
#   docker compose -p ui-sandbox -f docker-compose.ui-sandbox.yml up -d
# เข้าถึง: http://localhost:8081/admin/
# ============================================================
services:
  db:
    image: mysql:8.0
    container_name: scrap-pos-ui-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: pos_system
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Bangkok
    ports:
      - "3308:3306"
    volumes:
      - ui_db_data:/var/lib/mysql
      - ./base-pos/database/pos_system.sql:/docker-entrypoint-initdb.d/00-base-schema.sql:ro
      - ./customizations/database:/docker-entrypoint-initdb.d/pos-database:ro
      - ./docker/mysql-init.sh:/docker-entrypoint-initdb.d/99-run-migrations.sh:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./docker
      dockerfile: Dockerfile.php
    container_name: scrap-pos-ui-web
    restart: unless-stopped
    ports:
      - "8081:80"
      - "8444:443"
    volumes:
      - ./base-pos:/var/www/html:rw
      - ./customizations:/var/www/customizations:rw
      - ./uploads-ui:/var/www/html/uploads:rw
      - ./docker/apache-config.conf:/etc/apache2/sites-available/000-default.conf:ro
      - ./docker/ssl:/etc/apache2/ssl:ro
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/entrypoint.sh"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: db
      DB_NAME: pos_system
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET}
      APP_ENV: ${APP_ENV:-development}
      SELLER_ID_ENCRYPTION_KEY: ${SELLER_ID_ENCRYPTION_KEY:-}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-120}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      PRINT_SERVER_HOST: host.docker.internal
      PRINT_SERVER_PORT: "9120"
      TZ: Asia/Bangkok
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:80/api/index.php/auth/verify"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

volumes:
  ui_db_data:
