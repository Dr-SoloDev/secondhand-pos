<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รักษ์สะอาดรีไซเคิล - เข้าสู่ระบบ</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo-icon.svg">
</head>

<body class="login-page">
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <img src="assets/images/logo.svg" alt="SoloCorp OS" style="height:48px; margin-bottom:4px;">
        <h1>รักษ์สะอาดรีไซเคิล</h1>
        <p>ศูนย์รับซื้อของเก่า อำเภอเมืองสุรินทร์</p>
      </div>
      <div class="login-form">
        <form id="loginForm">
          <div class="form-group">
            <label for="username">ชื่อผู้ใช้</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="กรอกชื่อผู้ใช้" required>
          </div>
          <div class="form-group">
            <label for="password">รหัสผ่าน</label>
            <div class="password-wrapper">
              <input type="password" id="password" name="password" class="form-control" placeholder="กรอกรหัสผ่าน" required>
              <button type="button" class="password-toggle" id="passwordToggle" aria-label="แสดงรหัสผ่าน">แสดง</button>
            </div>
          </div>
          <div class="form-group">
            <button type="submit" class="btn btn-primary">เข้าสู่ระบบ</button>
          </div>
          <div class="login-message" id="loginMessage"></div>
        </form>
      </div>
    </div>
  </div>
  <div class="login-footer">
    <span>Powered by <strong>SoloCorp OS</strong> &mdash; Secondhand POS System</span>
  </div>
  <div id="notification-container"></div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/login.js"></script>
</body>

</html>
